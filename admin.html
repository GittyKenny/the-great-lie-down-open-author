<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage authors</title><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./admin-settings.css"></head><body><main><h1>Manage authors</h1><section id="login"><p>Sign in with the Supabase account that owns this publication.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="sign-in">Sign in</button></section><section id="manager" hidden><div class="heading"><div><h2>Authorship settings</h2><small id="signed-in-as"></small></div><button id="sign-out">Sign out</button></div><div class="mode-setting"><label for="authorship-mode">Who can join this book?</label><select id="authorship-mode"><option value="automatic">Open authorship</option><option value="approval">Approval required</option><option value="closed">Closed</option></select><button id="save-mode">Save setting</button><small id="mode-help"></small></div><h2>Authors and requests</h2><div id="requests"></div></section><p id="status" role="status"></p></main><script src="./supabase-config.js"></script><script type="module" src="./admin.js"></script></body></html>
